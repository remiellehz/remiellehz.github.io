<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemielleHz</title>
  <link rel="icon" type="image/x-icon" href="source/rem.png">
  <meta name="description" content="remi's portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosewater: #f5e0dc;
      --flamingo: #f2cdcd;
      --pink: #f5c2e7;
      --mauve: #cba6f7;
      --lavender: #b4befe;
      --blue: #89b4fa;
      --sky: #89dceb;
      --teal: #94e2d5;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --peach: #fab387;
      --maroon: #eba0ac;
      --accent: var(--pink);
      --text-1: #f5f5f5;
      --text-2: #cdd6f4;
      --card-bg: rgba(30, 30, 46, 0.68);
      --card-border: rgba(245, 194, 231, 0.28);
      --surface: rgba(166, 127, 168, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text-1);
      background: #1e1e2e;
      height: 100vh;
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('source/keyboard-2.png') center/cover no-repeat;
      filter: brightness(0.5);
      animation: fade-in 0.8s ease-out both;
    }

    main {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 32px;
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(24, 24, 37, 0.3);
      padding: 48px 40px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      transform: translateY(24px) scale(0.98);
      animation: card-show 0.8s cubic-bezier(0.2, 0.75, 0.25, 1) 0.8s forwards;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes card-show {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg, .card, .avatar-orbit {
        animation: none;
      }

      .bg, .card {
        opacity: 1;
        transform: none;
      }
    }

    .card::-webkit-scrollbar {
      display: none;
    }

    .avatar-wrap {
      position: relative;
      display: grid;
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      place-items: center;
      border-radius: 50%;
    }

    .avatar-orbit {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-origin: center;
      animation: avatar-orbit 8s linear infinite;
    }

    .avatar-orbit span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot-color);
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-66px);
    }

    .avatar-orbit span:nth-child(1) { --angle: 0deg; --dot-color: var(--rosewater); }
    .avatar-orbit span:nth-child(2) { --angle: 30deg; --dot-color: var(--flamingo); }
    .avatar-orbit span:nth-child(3) { --angle: 60deg; --dot-color: var(--pink); }
    .avatar-orbit span:nth-child(4) { --angle: 90deg; --dot-color: var(--mauve); }
    .avatar-orbit span:nth-child(5) { --angle: 120deg; --dot-color: var(--lavender); }
    .avatar-orbit span:nth-child(6) { --angle: 150deg; --dot-color: var(--blue); }
    .avatar-orbit span:nth-child(7) { --angle: 180deg; --dot-color: var(--sky); }
    .avatar-orbit span:nth-child(8) { --angle: 210deg; --dot-color: var(--teal); }
    .avatar-orbit span:nth-child(9) { --angle: 240deg; --dot-color: var(--green); }
    .avatar-orbit span:nth-child(10) { --angle: 270deg; --dot-color: var(--yellow); }
    .avatar-orbit span:nth-child(11) { --angle: 300deg; --dot-color: var(--peach); }
    .avatar-orbit span:nth-child(12) { --angle: 330deg; --dot-color: var(--maroon); }

    @keyframes avatar-orbit {
      to {
        transform: rotate(1turn);
      }
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 0;
      margin-bottom: 10px;
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--text-2);
      margin-bottom: 28px;
    }

    .divider {
      width: 60px;
      height: 1px;
      margin: 0 auto 28px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .bio {
      font-size: 20px;
      line-height: 1.85;
      color: var(--text-2);
      margin-bottom: 32px;
    }

    .bio p + p {
      margin-top: 16px;
    }

    .bio a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed;
    }

    .bio a:hover {
      color: var(--pink);
    }

    .social-btn svg path {
      fill: var(--pink);
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-1);
      background: var(--surface);
      border: 1px solid var(--card-border);
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      background: rgba(245, 194, 231, 0.16);
      border-color: rgba(245, 194, 231, 0.45);
    }

    .social-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--pink);
    }

    footer {
      text-align: center;
      padding: 16px 0 0;
      font-size: 13px;
      color: var(--text-2);
      margin-top: 24px;
      border-top: 1px solid rgba(245, 194, 231, 0.18);
    }

    @media (max-width: 600px) {
      .card {
        width: calc(100% - 12px);
        padding: 36px 24px 32px;
      }

      .name {
        font-size: 24px;
      }
    }
  </style>
</head>
