<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RemielleHz</title>
  <link rel="icon" type="image/x-icon" href="source/rem.png">
  <meta name="description" content="remi's portfolio." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <script>
    document.documentElement.classList.add("loading");
    window.addEventListener("load", () => {
      document.documentElement.classList.remove("loading");
      document.documentElement.classList.add("loaded");
    }, { once: true });
  </script>
  <style>
    :root {
      --rosewater: #f5e0dc;
      --flamingo: #f2cdcd;
      --pink: #f5c2e7;
      --mauve: #cba6f7;
      --lavender: #b4befe;
      --blue: #89b4fa;
      --sky: #89dceb;
      --teal: #94e2d5;
      --green: #a6e3a1;
      --yellow: #f9e2af;
      --peach: #fab387;
      --maroon: #eba0ac;
      --accent: var(--pink);
      --text-1: #f5f5f5;
      --text-2: #cdd6f4;
      --card-bg: rgba(30, 30, 46, 0.68);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text-1);
      background: #1e1e2e;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('source/keyboard-2.png') center/cover no-repeat;
      filter: brightness(0.5);
    }

    html.loading .bg {
      opacity: 0;
    }

    main {
      position: relative;
      z-index: 10;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 4dvh, 48px) clamp(12px, 3vw, 24px);
      overflow: hidden;
    }

    .card {
      width: 100%;
      max-width: 680px;
      max-height: 100%;
      text-align: center;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(24, 24, 37, 0.3);
      padding: clamp(12px, 5dvh, 48px) clamp(16px, 5vw, 40px) clamp(12px, 4dvh, 40px);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    html.loading .card {
      opacity: 0;
      transform: translateY(24px) scale(0.98);
    }

    html.loaded .bg {
      animation: fade-in 0.8s ease-out both;
    }

    html.loaded .card {
      opacity: 0;
      transform: translateY(24px) scale(0.98);
      animation: card-show 0.8s cubic-bezier(0.2, 0.75, 0.25, 1) 0.8s forwards;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes card-show {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg, .card, .avatar-orbit {
        animation: none;
      }

      html.loading .bg, html.loading .card, html.loaded .bg, html.loaded .card {
        opacity: 1;
        transform: none;
      }
    }

    .avatar-wrap {
      position: relative;
      display: grid;
      --avatar-size: clamp(52px, 22dvh, 120px);
      width: var(--avatar-size);
      height: var(--avatar-size);
      margin: 0 auto clamp(8px, 3dvh, 24px);
      place-items: center;
      border-radius: 50%;
    }

    .avatar-orbit {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-origin: center;
      animation: avatar-orbit 8s linear infinite;
    }

    .avatar-orbit span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(4px, 1.5dvh, 8px);
      height: clamp(4px, 1.5dvh, 8px);
      border-radius: 50%;
      background: var(--dot-color);
      transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--avatar-size) * -0.55));
    }

    .avatar-orbit span:nth-child(1) { --angle: 0deg; --dot-color: var(--rosewater); }
    .avatar-orbit span:nth-child(2) { --angle: 30deg; --dot-color: var(--flamingo); }
    .avatar-orbit span:nth-child(3) { --angle: 60deg; --dot-color: var(--pink); }
    .avatar-orbit span:nth-child(4) { --angle: 90deg; --dot-color: var(--mauve); }
    .avatar-orbit span:nth-child(5) { --angle: 120deg; --dot-color: var(--lavender); }
    .avatar-orbit span:nth-child(6) { --angle: 150deg; --dot-color: var(--blue); }
    .avatar-orbit span:nth-child(7) { --angle: 180deg; --dot-color: var(--sky); }
    .avatar-orbit span:nth-child(8) { --angle: 210deg; --dot-color: var(--teal); }
    .avatar-orbit span:nth-child(9) { --angle: 240deg; --dot-color: var(--green); }
    .avatar-orbit span:nth-child(10) { --angle: 270deg; --dot-color: var(--yellow); }
    .avatar-orbit span:nth-child(11) { --angle: 300deg; --dot-color: var(--peach); }
    .avatar-orbit span:nth-child(12) { --angle: 330deg; --dot-color: var(--maroon); }

    @keyframes avatar-orbit {
      to {
        transform: rotate(1turn);
      }
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 93.333%;
      height: 93.333%;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      font-size: clamp(24px, 7dvh, 50px);
      font-weight: 900;
      margin-bottom: clamp(4px, 1.5dvh, 10px);
      background: var(--accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(12px, 2.5dvh, 18px);
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--text-2);
      margin-bottom: clamp(12px, 4dvh, 28px);
    }

    .divider {
      width: 60px;
      height: 1px;
      margin: 0 auto clamp(12px, 4dvh, 28px);
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .bio {
      font-size: clamp(14px, 3dvh, 20px);
      line-height: 1.5;
      color: var(--text-2);
      margin-bottom: clamp(12px, 4dvh, 32px);
    }

    .bio strong {
      color: var(--accent);
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(6px, 1.5dvh, 12px);
      justify-content: center;
      margin-top: clamp(10px, 3dvh, 24px);
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(12px, 2dvh, 15px);
      font-weight: 500;
      padding: clamp(6px, 1.5dvh, 9px) clamp(10px, 2.5vw, 20px);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-2);
    }

    .social-btn:hover {
      color: var(--pink);
    }

    .social-icon {
      width: 16px;
      text-align: center;
      font-weight: 900;
    }

    .social-icon.x {
      font-size: 12px;
    }

    .social-icon.facebook {
      font-family: Arial, sans-serif;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: clamp(8px, 2dvh, 16px) 0 0;
      font-size: clamp(10px, 1.7dvh, 13px);
      color: var(--text-2);
      margin-top: clamp(10px, 3dvh, 24px);
      border-top: 1px solid rgba(245, 194, 231, 0.18);
    }

    footer a {
      color: var(--accent);
    }

    .theme-credit {
      display: block;
      margin-top: 8px;
      font-size: 0.85em;
      line-height: 1.4;
    }

    .theme-credit a {
      color: inherit;
    }

    @media (max-width: 600px) {
      .card { padding-inline: clamp(12px, 5vw, 24px); }

      .name {
        font-size: clamp(20px, 5dvh, 30px);
      }
    }

    @media (max-height: 480px) {
      .avatar-wrap {
        --avatar-size: clamp(44px, 16dvh, 76px);
      }

      .name {
        font-size: clamp(18px, 5dvh, 24px);
      }

      .subtitle,
      .divider,
      .bio {
        margin-bottom: clamp(6px, 2dvh, 12px);
      }

      .bio {
        font-size: clamp(12px, 3dvh, 16px);
      }

      .socials {
        margin-top: clamp(6px, 2dvh, 12px);
      }

      .social-btn {
        padding-top: 4px;
        padding-bottom: 4px;
      }

      footer {
        padding-top: 6px;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <main>
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-orbit" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <img class="avatar" src="source/rem.png" alt="Remi" draggable="false" />
      </div>

      <h1 class="name">Remi</h1>
      <p class="subtitle">RemielleHz</p>

      <div class="divider"></div>

      <div class="bio">
        <p>This is who I <strong style="color:var(--accent)">am</strong>.</p>
      </div>

      <div class="socials">
        <a class="social-btn" href="https://youtube.com/@remiellehz" target="_blank" rel="noopener"><span class="social-icon" aria-hidden="true">YT</span>@remiellehz</a>
        <a class="social-btn" href="https://discord.com/users/remiellehz" target="_blank" rel="noopener"><span class="social-icon" aria-hidden="true">D</span>@remiellehz</a>
        <a class="social-btn" href="https://x.com/remiellehz" target="_blank" rel="noopener"><span class="social-icon x" aria-hidden="true">𝕏</span>@remiellehz</a>
        <a class="social-btn" href="https://www.facebook.com/remielle.hqh/" target="_blank" rel="noopener"><span class="social-icon facebook" aria-hidden="true">f</span>Bạc Hà</a>
      </div>

      <footer>
        <p>© 2026 RemielleHz • All rights reserved.</p>
        <p>© 2021 present • <a href="https://github.com/catppuccin" target="_blank" rel="noopener">Catppuccin Org</a></p>
        </small>
      </footer>

    </div>
  </main>
</body>
</html>
